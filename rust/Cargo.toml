[package]
name = "simon"
version = "0.0.0"
edition = "2021"
description = "A CLI for managing iOS simulators, Android emulators, and physical devices"
default-run = "simon"

# Library (reused by the metroctl tool, which depends on this repo by git) + CLI.
[lib]
name = "simon"
path = "src/lib.rs"

[[bin]]
name = "simon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
inquire = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
jsonwebtoken = "9"

[profile.release]
strip = true
lto = true
