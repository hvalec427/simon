name: Build & Release

on:
  push:
    branches:
      - master   # stable releases
      - develop  # nightly prereleases

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize releases so concurrent pushes can't race on tagging/publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Must be macOS: pkg can't generate V8 bytecode for a macOS-arm64 target when
    # cross-building on Linux, and arm64 binaries need an (ad-hoc) code signature
    # that pkg applies natively on macOS. Linux builds produce binaries that are
    # killed on Apple Silicon. Capacity-related queue failures can just be re-run.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm 10 mis-hoists conflicting transitive majors (commitlint vs
      # semantic-release both pull conventional-commits-filter), producing a
      # lockfile it then rejects. npm 11 nests them correctly.
      - name: Pin npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # semantic-release records releases as git notes; without the existing
      # notes ref its push fails ("fatal error in commit_refs"). Fetch it first.
      - name: Fetch git notes
        run: git fetch origin "+refs/notes/*:refs/notes/*" || true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
