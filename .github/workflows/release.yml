name: Build & Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm 10 mis-hoists conflicting transitive majors (commitlint vs
      # semantic-release both pull conventional-commits-filter), producing a
      # lockfile it then rejects. npm 11 nests them correctly.
      - name: Pin npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
