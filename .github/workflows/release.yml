name: Build & Release

on:
  push:
    branches:
      - master   # stable (on merge from develop)
      - develop  # dev: rolling build on every commit
  schedule:
    # Nightly from develop, 23:00 Ljubljana in summer (CEST), 22:00 in winter —
    # GitHub cron is UTC-only. Tagged with the UTC date; skipped if there are no
    # code changes since the last nightly. GitHub may fire the cron late.
    - cron: "0 21 * * *"
  workflow_dispatch: {} # nightly (also on demand)

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize releases so concurrent pushes can't race on tagging/publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Scheduled runs always use the workflow file on the default branch (master),
  # which lags develop and once broke nightlies. This job only re-dispatches the
  # workflow on develop, so the nightly build runs develop's own definition.
  trigger-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch nightly on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref develop

  release:
    if: github.event_name != 'schedule'
    # Must be macOS: the binaries are built with cargo for both Apple targets and
    # ad-hoc code-signed with `codesign` (macOS-only), and iOS tooling is macOS
    # only. Capacity-related queue failures can just be re-run.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Manual runs may be started on any branch; nightlies always build develop.
      - name: Build from develop (nightly)
        if: github.event_name != 'push'
        run: |
          git fetch origin develop --tags
          git checkout -B develop origin/develop

      # Cache the cargo registry and build artifacts. Runners start cold, so
      # without this every push recompiles the whole dependency tree (rustls,
      # reqwest, ratatui, tungstenite, portable-pty, …) from scratch.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Node is only needed for semantic-release (stable channel); dev and
      # nightly builds don't touch it, so only set it up on stable pushes.
      - name: Set up Node (stable release only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install semantic-release deps (stable release only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          npm install -g npm@11
          npm ci

      # build-binaries.sh adds the Apple targets and compiles --release for both,
      # which is also the compile gate — so there's no separate build check.

      # develop push → rolling "dev" build (single prerelease, no changelog).
      - name: Dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dev-release.sh

      # Scheduled/manual → date-stamped nightly prerelease from develop (custom;
      # no semantic-release notes). Skips itself if there are no code changes.
      - name: Nightly release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/nightly-release.sh

      # Rule: a stable release must only contain commits already shipped to a
      # nightly — i.e. every new non-merge commit must be on develop.
      - name: Enforce stable comes from develop
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git fetch origin develop
          PREV=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-nightly' | head -1)
          OFFENDERS=""
          for c in $(git log ${PREV:+$PREV..}HEAD --no-merges --format=%H); do
            git merge-base --is-ancestor "$c" origin/develop || OFFENDERS="${OFFENDERS}$(git log -1 --oneline "$c")\n"
          done
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Stable release has commits not on develop (not nightly-built):"
            printf "%b" "$OFFENDERS"
            exit 1
          fi
          echo "OK — all released commits are on develop."

      # master → stable release via semantic-release.
      - name: Fetch git notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: git fetch origin "+refs/notes/*:refs/notes/*" || true

      - name: Stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
