name: Build & Release

on:
  push:
    branches:
      - master   # stable releases (on merge from develop)
      - develop  # rolling "dev" build on every commit
  schedule:
    # Nightly from develop, once a day at 23:00 UTC (end of the UTC day). Tagged
    # with the UTC date; skipped if there are no code changes since the last
    # nightly. GitHub may fire the cron late under load.
    - cron: "0 23 * * *"
  workflow_dispatch: {} # manual nightly on demand

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize releases so concurrent pushes can't race on tagging/publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Must be macOS: the binaries are built with cargo for both Apple targets and
    # ad-hoc code-signed with `codesign` (macOS-only), and iOS tooling is macOS
    # only. Capacity-related queue failures can just be re-run.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scheduled/manual runs check out the default branch (master); nightlies
      # must build from develop.
      - name: Build from develop (nightly)
        if: github.event_name != 'push'
        run: |
          git fetch origin develop --tags
          git checkout -B develop origin/develop

      # Node is only needed to run semantic-release (stable channel).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin npm 11
        run: npm install -g npm@11

      - name: Install dependencies (for semantic-release)
        run: npm ci

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Gate every release on the crate compiling.
      - name: Build check
        run: cargo build --manifest-path rust/Cargo.toml

      # develop push → rolling "dev" build (single prerelease, no changelog).
      - name: Dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dev-release.sh

      # Scheduled/manual → date-stamped nightly prerelease from develop (custom;
      # no semantic-release notes). Skips itself if there are no code changes.
      - name: Nightly release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/nightly-release.sh

      # Rule: a stable release must only contain commits already shipped to a
      # nightly — i.e. every new non-merge commit must be on develop.
      - name: Enforce stable comes from develop
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git fetch origin develop
          PREV=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-nightly' | head -1)
          OFFENDERS=""
          for c in $(git log ${PREV:+$PREV..}HEAD --no-merges --format=%H); do
            git merge-base --is-ancestor "$c" origin/develop || OFFENDERS="${OFFENDERS}$(git log -1 --oneline "$c")\n"
          done
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Stable release has commits not on develop (not nightly-built):"
            printf "%b" "$OFFENDERS"
            exit 1
          fi
          echo "OK — all released commits are on develop."

      # master → stable release via semantic-release.
      - name: Fetch git notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: git fetch origin "+refs/notes/*:refs/notes/*" || true

      - name: Stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
